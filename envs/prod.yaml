# Settings shared by every service in pet-portal-prod.
global:
  environment: prod
  imageRegistry: ghcr.io/pemadolker/pet-portal     # bootstrap/configure.sh sets your GitHub org
  ingressHost: portal.local
  logLevel: info
  tracing:
    endpoint: http://otel-collector.observability.svc:4318
    sampleRatio: "1"                              # services send every span; the collector keeps all errors and slow traces, 20 % of the rest (tail sampling)
  registry:
    endpoints: http://registry-etcd-0.registry-etcd.registry.svc:2379,http://registry-etcd-1.registry-etcd.registry.svc:2379,http://registry-etcd-2.registry-etcd.registry.svc:2379
