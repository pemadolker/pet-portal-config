# App of apps: Entry point for pet-portal-prod. Creates the Application objects only; each prod application is synced by hand (scripts/sync-prod.sh), which is the release approval.
# Apply once with:  kubectl apply -n argocd -f argocd/root-prod.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-prod
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  source:
    repoURL: https://github.com/CHANGE-ME/pet-portal-config.git
    targetRevision: main
    path: argocd/apps
    helm:
      valueFiles: [values.yaml, values-prod.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
