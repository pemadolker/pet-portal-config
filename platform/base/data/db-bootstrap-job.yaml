# Creates the 12 service roles and schemas (data/bootstrap.sh). It runs on every
# sync of the platform application, after PostgreSQL is ready (sync wave 1), and
# is safe to repeat. Passwords come from Secrets made by bootstrap/secrets.sh;
# they are never stored in Git.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  labels: { app.kubernetes.io/name: db-bootstrap }
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-bootstrap
        pet-portal.bt/db-job: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70                  # lets the postgres user read the mounted Secret files (mode 0440)
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: postgres:16-alpine
          command: ["sh", "/scripts/bootstrap.sh"]
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: postgres }
            - { name: PGDATABASE, value: petportal }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-superuser, key: password } }
            - { name: PASSWORDS_DIR, value: /passwords }   # one file per schema: /passwords/pet, ...
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script, mountPath: /scripts }
            - { name: passwords, mountPath: /passwords, readOnly: true }
      volumes:
        - name: script
          configMap: { name: db-bootstrap-script }
        - name: passwords
          secret: { secretName: postgres-service-passwords, defaultMode: 0440 }
