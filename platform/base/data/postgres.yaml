# PostgreSQL: one instance per environment, one schema and role per service
# (decision D2). A single instance is a known single point of failure; it is
# stated in the capacity plan and backed up nightly (postgres-backup.yaml).
# Runs as the postgres user (UID 70 in the alpine image) to meet the
# "restricted" Pod Security Standard. A postgres-exporter sidecar feeds the
# "Data stores" dashboard.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
    - { name: metrics, port: 9187, targetPort: metrics }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: database }
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/component: database }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - -c
            - max_connections=300          # 38 prod pods x pool 5-10 at peak, plus jobs
            - -c
            - shared_buffers=128MB
            - -c
            - log_min_duration_statement=500   # log statements slower than 500 ms
            - -c
            - log_lock_waits=on
          env:
            - name: POSTGRES_DB
              value: petportal
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-superuser, key: password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "petportal"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - name: DATA_SOURCE_URI
              value: localhost:5432/petportal?sslmode=disable
            - name: DATA_SOURCE_USER
              value: postgres
            - name: DATA_SOURCE_PASS
              valueFrom: { secretKeyRef: { name: postgres-superuser, key: password } }
          ports:
            - { name: metrics, containerPort: 9187 }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  endpoints:
    - { port: metrics, interval: 30s }
---
# Only pods labelled as PostgreSQL clients (services with database.enabled, and
# the database jobs) may connect. Prometheus may read the exporter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { pet-portal.bt/postgres-client: "true" } }
        - podSelector: { matchLabels: { pet-portal.bt/db-job: "true" } }
      ports:
        - { port: 5432, protocol: TCP }
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports:
        - { port: 9187, protocol: TCP }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
