# The service registry: a three-member etcd cluster (decision D4), separate from
# the cluster's own etcd, which we never touch. Services register under
# /pet-portal/<env>/services/ with a 15 s lease; the gateway watches that prefix
# and /pet-portal/<env>/config/ for live settings.
#
# Three members tolerate the loss of one (quorum is 2), which experiment E8 tests.
# Hard anti-affinity puts each member on a different worker, so one node failure
# can never take two members (E7). PodDisruptionBudget: a drain may evict only
# one member at a time.
apiVersion: v1
kind: Service
metadata:
  name: registry-etcd
  namespace: registry
  labels: { app.kubernetes.io/name: registry-etcd }
spec:
  clusterIP: None                 # headless: stable DNS per member (registry-etcd-0.registry-etcd.registry.svc)
  publishNotReadyAddresses: true  # members must find each other before they are ready
  selector: { app.kubernetes.io/name: registry-etcd }
  ports:
    - { name: client, port: 2379 }
    - { name: peer, port: 2380 }
    - { name: metrics, port: 2381 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry-etcd
  namespace: registry
  labels: { app.kubernetes.io/name: registry-etcd }
spec:
  serviceName: registry-etcd
  replicas: 3
  podManagementPolicy: Parallel   # all members start together, as etcd bootstrapping expects
  selector:
    matchLabels: { app.kubernetes.io/name: registry-etcd }
  template:
    metadata:
      labels: { app.kubernetes.io/name: registry-etcd }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app.kubernetes.io/name: registry-etcd }
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.35
          command:
            - etcd
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://$(POD_NAME).registry-etcd.registry.svc:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://$(POD_NAME).registry-etcd.registry.svc:2380
            - --listen-metrics-urls=http://0.0.0.0:2381
            - --initial-cluster=registry-etcd-0=http://registry-etcd-0.registry-etcd.registry.svc:2380,registry-etcd-1=http://registry-etcd-1.registry-etcd.registry.svc:2380,registry-etcd-2=http://registry-etcd-2.registry-etcd.registry.svc:2380
            - --initial-cluster-state=new
            - --initial-cluster-token=pet-portal-registry
            - --auto-compaction-mode=periodic
            - --auto-compaction-retention=1h
            - --quota-backend-bytes=268435456   # 256 MiB; registry data is tiny
            - --snapshot-count=10000
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { name: client, containerPort: 2379 }
            - { name: peer, containerPort: 2380 }
            - { name: metrics, containerPort: 2381 }
          readinessProbe:
            httpGet: { path: /health, port: metrics }   # healthy only with a leader (quorum)
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: client }                 # not /health: losing quorum must not restart healthy members
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/etcd }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registry-etcd
  namespace: registry
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: registry-etcd }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: registry-etcd
  namespace: registry
  labels: { app.kubernetes.io/name: registry-etcd, release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: registry-etcd }
  endpoints:
    - { port: metrics, interval: 15s }
---
# Clients: portal pods labelled registry-client (both environments) and anything
# in the registry namespace (members and an etcdctl debug pod). Peers talk on 2380.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-etcd
  namespace: registry
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: registry-etcd }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { app.kubernetes.io/part-of: pet-portal } }
          podSelector: { matchLabels: { pet-portal.bt/registry-client: "true" } }
        - podSelector: {}
      ports:
        - { port: 2379, protocol: TCP }
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: registry-etcd } }
      ports:
        - { port: 2380, protocol: TCP }
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports:
        - { port: 2381, protocol: TCP }
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: registry-etcd } }
      ports:
        - { port: 2380, protocol: TCP }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
