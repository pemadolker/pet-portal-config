# Argo CD's application metrics (argocd_app_info) for the Delivery panel and the
# ArgoAppOutOfSync / ArgoAppDegraded alerts.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-metrics
  namespace: monitoring
  labels: { release: kube-prometheus-stack }
spec:
  namespaceSelector:
    matchNames: [argocd]
  selector:
    matchLabels: { app.kubernetes.io/name: argocd-metrics }
  endpoints:
    - { port: metrics, interval: 30s }
