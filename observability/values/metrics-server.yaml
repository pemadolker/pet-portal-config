# metrics-server 3.14.0 (chart): CPU and memory per pod, needed by the CPU
# triggers (KEDA creates CPU-based HPAs) and by `kubectl top`.
# Kind's kubelets use self-signed certificates, hence --kubelet-insecure-tls.
args:
  - --kubelet-insecure-tls
  - --kubelet-preferred-address-types=InternalIP
resources:
  requests: { cpu: 20m, memory: 48Mi }
  limits: { memory: 128Mi }
serviceMonitor:
  enabled: false
