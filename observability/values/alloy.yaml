# Grafana Alloy 1.15.0 (chart) as a DaemonSet: on every node it tails the pod log
# files under /var/log/pods and pushes them to Loki with namespace, pod, container
# and app labels. The services' JSON logs are parsed so level and service become
# labels and trace_id becomes structured metadata (searchable, and linked to Tempo).
controller:
  type: daemonset
alloy:
  mounts:
    varlog: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 160Mi }
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        // Portal services log JSON (pino). Keep level and service as labels (few
        // values), trace_id as structured metadata (one value per request).
        stage.match {
          selector = "{namespace=~\"pet-portal-.*\"}"
          stage.json {
            expressions = { level = "level", service = "service", trace_id = "trace_id" }
          }
          stage.labels {
            values = { level = "", service = "" }
          }
          stage.structured_metadata {
            values = { trace_id = "" }
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc:3100/loki/api/v1/push"
        }
      }
