# prod: manual sync in Argo CD. image.tag is promoted from dev by a reviewed pull request.
image:
  tag: "c839fcf"   # changed only by the promote workflow (a reviewed pull request)
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  cooldownPeriod: 120
  scaleDownStabilizationSeconds: 120
  triggers:
    # For a queue consumer the waiting work is the real load:
    # one pod per 20 entries not yet read by the email-worker group.
    - type: redis-streams
      metadata:
        address: redis.{{ .Release.Namespace }}.svc.cluster.local:6379
        stream: email.queue
        consumerGroup: email-worker
        lagCount: "20"
