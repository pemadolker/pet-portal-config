# 13. notification (async): In-app messages from events; queues emails on email.queue.
# Rendered with charts/microservice. Only differences from the chart defaults are listed.
name: notification
group: async

database:
  enabled: true
migration:
  enabled: true

redis:
  enabled: true

networkPolicy:
  allowFrom:
    - api-gateway

env:
  PUBLIC_URL: "https://{{ .Values.global.ingressHost }}"   # link in emails
