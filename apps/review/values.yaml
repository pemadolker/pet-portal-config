# 11. review (core): Shelter reviews and ratings.
# Rendered with charts/microservice. Only differences from the chart defaults are listed.
name: review
group: core

database:
  enabled: true
migration:
  enabled: true

# Services this one calls (sets <NAME>_URL and opens egress).
upstreams:
  - shelter
  - profile

networkPolicy:
  allowFrom:
    - api-gateway
