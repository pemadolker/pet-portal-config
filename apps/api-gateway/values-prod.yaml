# prod: manual sync in Argo CD. image.tag is promoted from dev by a reviewed pull request.
image:
  tag: "c839fcf"   # changed only by the promote workflow (a reviewed pull request)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  triggers:
    # CPU-bound work (routing and JWT checks): scale at 70 % of the CPU request.
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
